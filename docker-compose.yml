version: '3.8'

services:
  # PostgreSQL Database
  chatbot_db:
    image: postgres:15
    container_name: chatbot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=bdu_chatbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - chatbot_network

  # Backend Django Service
  chatbot_be:
    build:
      context: ./backend 
    container_name: chatbot_be
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles 
    ports:
      - "8019:3019"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/bdu_chatbot
      - DJANGO_SETTINGS_MODULE=backend.settings
      # Ghi đè đường dẫn trong .env để trỏ đúng vào vị trí trong container cho OCR
      - TESSERACT_PATH_RELATIVE=/usr/bin/tesseract
      - POPPLER_PATH_RELATIVE=/usr/bin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/chat/health-check/"] # Dùng một URL không cần auth
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  chatbot_network:
    driver: bridge